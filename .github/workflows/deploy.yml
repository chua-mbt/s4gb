name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Install sbt
        uses: coursier/setup-action@v3.1.1
        with:
          jvm: temurin:25
          apps: sbt

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Build
        run: sbt compile

      - name: Run Tests
        run: sbt test -DgenerateReport=true

      - name: Generate Opcode Table
        run: sbt "opcodeTable/run"

      - name: Build Emulator
        run: sbt "jsShell/generateHtml"

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r integration-tests/target/reports/* _site/ 2>/dev/null || true
          cp -r opcode-table/target/docs/* _site/ 2>/dev/null || true
          cp js-shell/target/scala-*/s4gb-js-shell-opt/index.html _site/emulator.html
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head><title>s4gb Artifacts</title></head>
          <body>
            <h1>s4gb Artifacts</h1>
            <ul>
              <li><a href="emulator.html">Emulator</a></li>
              <li><a href="report.html">Integration Test Report</a></li>
              <li><a href="opcode-table.html">Opcode Table</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
